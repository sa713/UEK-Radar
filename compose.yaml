name: uek-radar
services:
  web:
    build:
      context: .
      target: web
    image: uek-radar-web:local
    restart: unless-stopped
    init: true
    env_file: /etc/uek-radar/keys.env
    environment:
      DATABASE_PATH: /data/radar.sqlite
      UPLOAD_PATH: /data/uploads
    volumes:
      - radar_data:/data
    expose:
      - '3000'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/auth/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
  worker:
    build:
      context: .
      target: worker
    image: uek-radar-worker:local
    restart: unless-stopped
    init: true
    env_file: /etc/uek-radar/keys.env
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  caddy:
    profiles: [proxy]
    image: caddy:2
    restart: unless-stopped
    env_file: /etc/uek-radar/keys.env
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
volumes:
  radar_data:
  caddy_data:
  caddy_config:
